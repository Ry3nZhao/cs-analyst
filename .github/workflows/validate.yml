name: Validate

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'README.md'
  pull_request:
    branches:
      - master
    paths-ignore:
      - 'README.md'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared-types
        run: pnpm --filter @cs-analyst/shared-types build

      - name: Build sidecar
        run: pnpm --filter @cs-analyst/sidecar build

  frontend:
    name: Nuxt generate
    runs-on: ubuntu-latest
    needs: typescript
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 前端运行时会 import @cs-analyst/shared-types（入口是 dist/），要先构建
      - name: Build shared-types
        run: pnpm --filter @cs-analyst/shared-types build

      - name: Generate frontend
        run: pnpm --filter @cs-analyst/desktop generate

  rust:
    name: Rust check + test (Windows)
    runs-on: windows-2022
    env:
      CARGO_TERM_PROGRESS_WHEN: always
      CARGO_TERM_PROGRESS_WIDTH: 80
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared-types and sidecar
        run: pnpm --filter @cs-analyst/shared-types build && pnpm --filter @cs-analyst/sidecar build

      - name: Bundle sidecar resources
        run: pnpm build:sidecar

      - name: Verify sidecar resources
        shell: bash
        run: test -f src/tauri/src-tauri/resources/sidecar/index.js

      - name: Generate frontend
        run: pnpm --filter @cs-analyst/desktop generate

      - name: Generate app icons
        run: pnpm generate-icons

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2.9.1
        with:
          workspaces: src/tauri/src-tauri

      - name: Cargo check
        working-directory: src/tauri/src-tauri
        run: cargo check --workspace --timings

      # 样例 demo 不在 CI 上（未设置 CS_ANALYST_SAMPLE_DEMOS 时自动跳过）；这里跑单元测试与 schema 测试
      - name: Cargo test
        working-directory: src/tauri/src-tauri
        run: cargo test --workspace
